    <main class="container mt-4">
        <h1>Conversão da forma algébrica para polar/trigonométrica</h1>
        <div class="mt-4 d-flex justify-content-between">
            <div class="bg-secondary col-4 p-2" id="main">
                <label>Entrada</label><br>
                <p>Z=
                    <input type="number" id="aa">+
                    <input type="number" id="ba">× i<br>
                    <button id="calc" onclick="altrigo()">Calcular</button>

            </div>
            <div id="op" class=" p-2">
                <button class="mt-4" onclick="">←<br>→</button> <!--Trocar entrada e saída-->
            </div>
            <div class="bg-secondary col-4 p-2" id="main">
                <label>Saída</label>
                <p>Z = <span id='output'></span></p>

        <!--seria interessante fazer o mesmo botão de trocar, mas dessa vez
