<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Inicial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="src/css/naosei.css">
</head>
<body>
    <header class="header pb-4">
        <h1 class="h1 ">Calculadora complexa</h1>
        <!-- menu -->
        <ul>
            <li><a href="basi1.html">Operações básicas na forma algébrica</a></li>
            <li><a href="basi2.html">Operações básicas na forma polar</a></li>
            <li><a href="gauss.html">Representação gráfica</a></li>
            <li><a href="geomet.html">Geometria analítica</a></li>
            <li><a href="algtrigo.html">Conversão de formas</a></li>
        </ul>
    </header>
    <div class="container mt-4">
        <h1>Operações básicas de nºs complexos polares</h1>
        <div class="mt-4 d-flex justify-content-between bg-secondary" id="main">
            <div id="opA" class="col-4 p-2 border border-dark">
                <label>ZA =
                    <input type="number" id="moduloa"> × [cos(<span id="anga">θ</span>) + i × sen(<span id="anga">θ</span>)]
                </label>
                <input type="number" id="anga_put" ><!--Para alterar o θ aperta enter. exemplo em https://www.w3schools.com/js/tryit.asp?filename=tryjs_events_detectenter-->
            </div>
            <div id="op" class="p-3 pt-2 border border-dark">
                <label>Operações:</label>
                <div class="p-1">
                    <button class="mt-4" onclick="trocarValores()">←<br>→</button> <!--Trocar de lado-->
                    <button class="mt-4" onclick="calculaOperacao('soma')">ZA + ZB</button> <!--soma-->
                    <button class="mt-4" onclick="calculaOperacao('subtracao')">ZA - ZB</button><!--diferença-->
                    <button class="mt-4" onclick="calculaOperacao('multiplicacao')">ZA × ZB</button> <!--multiplicação-->
                    <button class="mt-4" onclick="calculaOperacao('divisao')">ZA / ZB</button> <!--divisão-->
                </div>
            </div>
            <div id="opB" class="col-4 p-2 border border-dark">
                <label>ZB =
                    <input type="number" id="modulob"> × [cos(<span id="angb">θ</span>) + i × sen(<span id="angb">θ</span>)]
                </label>
                <input type="number" id="angb_put"><!--Para colocar o ângulo-->
              <!--Para alterar o θ aperta enter. exemplo em https://www.w3schools.com/js/tryit.asp?filename=tryjs_events_detectenter-->
            </div>
        </div>
        <div class="mt-3">
            <p>RESOLUÇÃO:</p>
            <p id="resultado"></p>
        </div>
    </div>
    <footer class="footer mt-auto">
        <ul>
            <li><a href="about.html">Sobre nós</a></li>
        </ul>
    </footer>
    <script src="https://unpkg.com/mathjs@15.2.0/lib/browser/math.js"></script>
    <script src="src/js/calc.js"></script>
</body>
</html>
